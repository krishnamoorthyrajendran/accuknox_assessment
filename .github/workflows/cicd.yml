name: Accuknox CI/CD

on:
  push:
    branches:
      - prod
permissions:
  contents: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/krishnamoorthyrajendran/wisecow:${{ github.run_number }} .

      - name: Tag Docker Image
        run: |
          docker tag ghcr.io/krishnamoorthyrajendran/wisecow:${{ github.run_number }} \
          ghcr.io/krishnamoorthyrajendran/wisecow:${{ github.run_number }}

      - name: Push Docker Image
        run: |
          docker push ghcr.io/krishnamoorthyrajendran/wisecow:${{ github.run_number }}

      - name: Update Kubernetes Manifest
        run: |
          sed -i \
            "s|image: ghcr.io/krishnamoorthyrajendran/wisecow:.*|image: ghcr.io/krishnamoorthyrajendran/wisecow:${{ github.run_number }}|" \
            k8s/deployment.yaml

      - name: Commit and Push Updated Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update deployment image to version ${{ github.run_number }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:prod
